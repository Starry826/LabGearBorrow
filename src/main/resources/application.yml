spring:
  application:
    name: JaveWeb
  datasource:
    url: jdbc:mysql://mysql:3306/lab?useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  mail:
    host: smtp.163.com
    port: 994
    username: ${SPRING_MAIL_USERNAME}             # 邮箱地址
    password: ${SPRING_MAIL_PASSWORD}             # 邮箱授权码
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            fallback: false

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.starry
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.starry.mapper: DEBUG